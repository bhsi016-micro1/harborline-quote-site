<style>

<body>
<p><a href="../">Harborline Facility Services</a> / Services</p>
<h1>Floor care</h1>
<p>Strip and wax, carpet extraction and tile scrubbing, scheduled on weekends so your team never works around wet floors.</p>
<p>Read our <a href="../guides/medical-office-cleaning.html">cleaning guides</a> or ask for a price below.</p>
<form id="quote">
  <input type="hidden" name="service_type" value="floor">
  <label>Company name <input name="company" required></label>
  <label>Approximate square feet <input name="sqft" type="number" min="100" required></label>
  <button type="submit">Request a quote</button>
</form>
<p id="done">Thanks, your quote request was received.</p>
<script>
  document.getElementById('quote').addEventListener('submit', function (e) {
    e.preventDefault();
    // Only the space type goes to GA; company name and size stay in the browser.
    gtag('event', 'quote_request_submit', { service_type: this.service_type.value });
    this.style.display = 'none';
    document.getElementById('done').style.display = 'block';
  });
</script>
